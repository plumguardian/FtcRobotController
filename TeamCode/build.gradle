import io.freefair.gradle.plugins.lombok.tasks.Delombok
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.android' version '2.4.20'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.4.20'
    id 'io.freefair.android-lombok' version '8.13.+' apply false
}

apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here
apply plugin: 'io.freefair.android-lombok'

tasks.withType(Delombok).configureEach {
    classpath.from(file(
            "${android.sdkDirectory}/platforms/${android.compileSdkVersion}/android.jar"
    ))
    target = file(layout.buildDirectory.dir("delombok"))
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
    }

    jvmToolchain(25)
}

repositories {
    maven { url "https://repo.dairy.foundation/releases" }
    maven { url "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation "com.pedropathing:revhub:3.0.1"
    implementation "com.pedropathing:tuning:1.0.1"
    implementation "com.pedropathing.ivy:pedro:1.1.1"
    implementation "com.bylazar:fullpanels:1.0.13"
    implementation "org.solverslib:core:0.3.6"
    implementation "org.solverslib:pedroPathing:0.3.6"
//    implementation "org.solverslib:photon:0.3.6"
}
