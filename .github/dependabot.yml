version: 2

registries:
  dairy-maven:
    type: maven-repository
    url: https://repo.dairy.foundation/releases

  bylazar-maven:
    type: maven-repository
    url: https://mymaven.bylazar.com/releases

  jitpack:
    type: maven-repository
    url: https://jitpack.io

  r8-releases:
    type: maven-repository
    url: https://storage.googleapis.com/r8-releases/raw

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "BIOBUZZ-2026"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    registries:
      - dairy-maven
      - bylazar-maven
      - r8-releases
      - jitpack
    ignore:
      - dependency-name: "com.android.tools:r8"
        versions: [">=9.2.0"]
    assignees:
      - "plumguardian"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "BIOBUZZ-2026"
    schedule:
      interval: "weekly"
    assignees:
      - "plumguardian"
