name: Build

on:
  pull_request:
  push:
    branches: [ 'BIOBUZZ-2026' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: ./gradlew build
