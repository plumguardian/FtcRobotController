pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'io.freefair.android-lombok') {
                useModule("com.github.plumguardian:android-gradle-plugins:${requested.version}")
            }
        }
    }
}

plugins {
    id 'com.gradle.develocity' version '4.6.1'
}

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
        publishing.onlyIf { false }
    }
}

include ':FtcRobotController'
include ':TeamCode'
