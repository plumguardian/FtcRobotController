pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case 'io.freefair.android-lombok':
                    useModule("com.github.plumguardian:android-gradle-plugins:${requested.version}")
                    break

                case 'dev.tocraft.preprocessor':
                    useModule("com.github.plumguardian:PreProcessor:${requested.version}")
                    break
            }
        }
    }
}

plugins {
    id 'com.gradle.develocity' version '4.6.1'
}

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
        publishing.onlyIf { false }
    }
}

include ':FtcRobotController'
include ':TeamCode'
